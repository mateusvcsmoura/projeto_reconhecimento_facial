name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest

    services:
      # O mesmo PostgreSQL do docker-compose. Os testes de integracao rodam
      # contra banco real de proposito: as regras de negocio deste projeto
      # sao constraints, e verifica-las com duble provaria menos.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: escola
          POSTGRES_PASSWORD: ci-nao-e-segredo
          POSTGRES_DB: escola_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U escola"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A aplicacao exige DATABASE_URL; a suite usa TEST_DATABASE_URL.
      DATABASE_URL: postgresql+psycopg://escola:ci-nao-e-segredo@localhost:5432/escola_test
      TEST_DATABASE_URL: postgresql+psycopg://escola:ci-nao-e-segredo@localhost:5432/escola_test
      APP_TIMEZONE: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Mesma faixa que a aplicacao exige (ver requirements.txt).
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        # Sem opencv-python e sem deepface: a suite roda com dubles de
        # modulo. Se um teste passar a exigi-los, este passo falha.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tipos (mypy)
        run: mypy

      - name: Migrations sobem e descem
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Schema nao diverge dos modelos
        run: alembic check

      - name: Testes com cobertura
        # O piso de 80% e o criterio do REFACTORING_PLAN para dominio e
        # aplicacao; medimos o pacote inteiro, que ja esta acima disso.
        run: pytest --cov=src --cov=scripts.metricas --cov-report=term-missing --cov-fail-under=80

      - name: Nenhum dado sensivel versionado
        run: |
          if git ls-files | grep -Ei '\.db$|^\.env$|\.jpg$|\.png$|\.npy$|^storage/|^fotos/'; then
            echo "ERRO: arquivo sensivel versionado"
            exit 1
          fi
          echo "OK: nenhum arquivo sensivel rastreado"
