# Configuracao das ferramentas de qualidade.
# As dependencias continuam em requirements.txt.

[tool.ruff]
line-length = 88
target-version = "py312"
# Qualquer ambiente virtual, e nao apenas ".venv": o projeto usa um
# segundo (.venv-app) com o DeepFace, que a suite nao precisa.
exclude = [".venv*", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplificacoes
    "RUF",  # regras do proprio ruff
]
ignore = [
    # O projeto e escrito em portugues sem acentos nos identificadores;
    # nomes como `nao_encontrado` disparam falso positivo de ortografia.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Os passos de BDD sao registrados por decorator; o pyflakes os ve como
# funcoes nao usadas.
"tests/features/*" = ["F811"]

[tool.mypy]
# Sem `python_version` de proposito: fixa-lo em 3.11 faz o mypy recusar os
# stubs do numpy 2.5, que usam sintaxe de 3.12. Quem guarda o piso de versao
# e o ruff, via `target-version = "py312"` -- ele acusa sintaxe nova demais
# para o interpretador que o DeepFace exige. Ao mypy cabe checar tipos.
files = ["src", "scripts"]
exclude = "(migrations/versions|[.]venv)"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

# cv2 e deepface nao publicam type stubs. matplotlib publica, mas so existe
# no ambiente experimental (requirements-experimentos.txt), nao no CI.
[[tool.mypy.overrides]]
module = ["cv2.*", "deepface.*", "matplotlib.*"]
ignore_missing_imports = true
